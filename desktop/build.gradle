plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.graphics']
}

dependencies {
    implementation project(':common')
}

application {
    // 用 Launcher 而不是 MainApp：jpackage 打包后 JavaFX 走 classpath 分发，
    // 直接以 Application 子类作为 main class 会被启动器拒绝。
    mainClass = 'com.filesync.desktop.Launcher'
}
